<!DOCTYPE html> <!--serve para indicar a programação utilizada\\
ultilizada -->
<html lang="pt-br"> <!-- abertura que delimita o documento, todas as tags devem ficar ficar dentro desse espaço.ultilizada-->
<head> <!--define o cabeçalho do documento,as informações colocadas dentro desse limite, não aparecem no navegador, mas contém instruções sobre esse conteúdo. Dentro dessa teg podemos colocar folhas e estilo e script.-->
    <meta charset="UTF-8"> <!--especifica qual conjunto de carcteres (character set ou charset) será usado para renderizar (converter o código em um arquivo) o texto da página.-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!--fonecem os metados sobre a sua página.-->
    <title>Portifolio</title> <!-- é o título do seu documento-->
</head> <!-- Fechamento da tag do cabeçalho.-->
<body> <!--abertura da tag, marcando o espaço no qual deve estar contido e estar o conteúdo.-->
    <!-- um documento HTML é composto por tags que são escritas entre < >.As tags precisam ser abertas e fechadas, o que as diferenciam  é que as tags de fechamento possuem uma \ antes do nome. Alguns códigos não precisam da <\> para fechamento, apenas a da barra,como no caso da tag meta.
    
</body><!-- fechamento da tag do corpo do projeto.-->
</html> <!--fechamento do documento -->
